[project]
name = "host-rig-bridge"
version = "0.2.0"
description = "主机 Claude Code ↔ 多台分机账号 MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp[server]~=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]