# rigs.yaml — 分机清单公开版示例
# 真实清单放在 ~/.claude/host-rig-bridge/rigs.local.yaml (gitignored)
# 字段定义见 docs/03-rigs-format.md
#
# 用法:
#   cp rigs.local.yaml.example ~/.claude/host-rig-bridge/rigs.local.yaml
#   然后修改 ~/.claude/host-rig-bridge/rigs.local.yaml

version: 1
default_rig: rig

rigs:
  - alias: rig
    host: 192.168.x.x                 # ← 改: 外机 IP
    user: mcp-rig                     # Windows 本地账号名
    key: ~/.ssh/id_claude_mcp
    sandbox: C:/Users/mcp-rig/projects             # 路径沙箱根
    server: C:/Users/mcp-rig/mcp-server/src/server/server.py
    venv: C:/Users/mcp-rig/mcp-server/.venv
    capabilities: [sync, async]
    tools:
      - iverilog
      - vvp
      - quartus_sh
      - openFPGALoader
    notes: "实验室装机机 (示例, 主人按需修改)"

  - alias: rig-build-2
    host: 192.168.x.y
    user: mcp-rig
    key: ~/.ssh/id_claude_mcp
    sandbox: C:/Users/mcp-rig/projects
    server: C:/Users/mcp-rig/mcp-server/src/server/server.py
    venv: C:/Users/mcp-rig/mcp-server/.venv
    capabilities: [sync]            # 仅同步, 不开异步
    tools:
      - iverilog
      - vvp
    notes: "备用编译机 (示例)"